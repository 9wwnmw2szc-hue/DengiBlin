name: marketbrain
x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://marketbrain:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres/marketbrain
  volumes:
    - broker_keys:/var/lib/marketbrain/keys
    - broker_tokens:/var/lib/marketbrain/tokens
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: marketbrain
      POSTGRES_DB: marketbrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U marketbrain -d marketbrain"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, 'yes']
    volumes: [redis_data:/data]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    restart: 'no'
    depends_on:
      postgres: {condition: service_healthy}
  worker:
    <<: *backend
    command: [python, -m, app.worker]
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import time; from redis import Redis; from app.config import settings; v=Redis.from_url(settings.redis_url).get('worker:heartbeat'); assert v and time.time()-float(v)<45"]
      interval: 15s
      timeout: 5s
      retries: 3
  backend:
    <<: *backend
    depends_on:
      migrate: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 15s
      timeout: 8s
      retries: 5
  frontend:
    build: ./frontend
    ports: ['127.0.0.1:3000:3000']
    environment:
      API_INTERNAL_URL: http://backend:8000
    depends_on:
      backend: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped
volumes:
  postgres_data:
  redis_data:
  broker_keys:
  broker_tokens:
